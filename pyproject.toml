[project]
name = "mindmesh"
version = "0.1.0"
description = "MindMesh AI - CP-SAT team partitioning with objectives from team composition research"
requires-python = ">=3.11"
dependencies = [
    "ortools>=9.10",
]

[project.optional-dependencies]
eval = ["matplotlib>=3.8", "pandas>=2.0"]
llm = ["google-genai>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools]
packages = ["solver", "eval"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
